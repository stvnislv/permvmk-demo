<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Каталог работ ПВМК: памятники из гранита. Фотографии с сайта компании permvmk.ru.">
<meta name="theme-color" content="#0c0b0a">
<title>Работы — ПВМК</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Ruslan+Display&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
:root {
  --bg: #0c0b0a;
  --bg-2: #161411;
  --ink: #1a140c;
  --brass: #c6a15a;
  --brass-2: #e4cf9a;
  --text: #f3eee6;
  --muted: #c4bdb2;
  --line: rgba(243, 238, 230, .14);
  --header: 72px;
  --serif: "Ruslan Display", Georgia, serif;
  --sans: Manrope, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 88px; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 1.05rem; line-height: 1.65; }
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass-2); outline-offset: 3px; }
.wrap { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
nav { position: sticky; top: 0; z-index: 20; background: rgba(12, 11, 10, .94); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }
.nav-inner { min-height: var(--header); display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.logo { font-family: var(--serif); font-size: 1.85rem; font-weight: 400; letter-spacing: .02em; text-decoration: none; color: var(--brass-2); }
.nav-links { display: flex; gap: 22px; list-style: none; padding: 0; }
.nav-links a { text-decoration: none; color: var(--muted); font-size: .92rem; }
.nav-links a:hover, .nav-links a[aria-current="page"] { color: var(--text); }
.phone { color: var(--text); text-decoration: none; font-weight: 700; white-space: nowrap; }
.burger { display: none; width: 44px; height: 44px; border: 0; background: transparent; color: var(--text); font-size: 1.4rem; }
header.page { padding: 48px 0 10px; }
h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(2.6rem, 5vw, 4.2rem); line-height: 1.12; letter-spacing: .01em; margin: 10px 0 12px; }
.lead { color: var(--muted); max-width: 38rem; }
.gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 36px 0 72px; }
.shot { margin: 0; background: var(--bg-2); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
.shot img { width: 100%; aspect-ratio: 3/4; object-fit: cover; object-position: center top; }
.shot figcaption { padding: 12px 14px 14px; color: var(--muted); font-size: .88rem; }
.shot strong { display: block; color: var(--text); font-weight: 600; margin-bottom: 2px; }
footer { border-top: 1px solid var(--line); padding: 28px 0 36px; color: var(--muted); font-size: .88rem; }
footer a { color: var(--text); }
@media (max-width: 900px) {
  .gallery { grid-template-columns: 1fr 1fr; }
  .nav-links { display: none; }
  .burger { display: grid; place-items: center; }
  .nav-links.open { display: flex; flex-direction: column; position: absolute; left: 0; right: 0; top: 100%; padding: 12px 20px 18px; background: #0c0b0a; border-bottom: 1px solid var(--line); }
}
@media (max-width: 560px) { .gallery { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<nav>
  <div class="wrap nav-inner">
    <a class="logo" href="../">ПВМК</a>
    <ul class="nav-links" id="navLinks">
      <li><a href="../#services">Услуги</a></li>
      <li><a href="./" aria-current="page">Работы</a></li>
      <li><a href="../#about">О комплексе</a></li>
      <li><a href="../#contacts">Контакты</a></li>
    </ul>
    <a class="phone" href="tel:+73422982959">+7 (342) 298-29-59</a>
    <button class="burger" id="burger" type="button" aria-label="Меню" aria-expanded="false">☰</button>
  </div>
</nav>
<main>
  <header class="page">
    <div class="wrap pop">
      <p style="color:#c6a15a;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase">Каталог</p>
      <h1>Работы</h1>
      <p class="lead">Примеры памятников из каталога ПВМК. Подписи — порода камня и тип стелы, как на сайте компании.</p>
    </div>
  </header>
  <div class="wrap">
    <div class="gallery">
      <figure class="shot pop">
        <img src="work-hero.jpg" alt="Памятник из чёрного гранита, художественный портрет" width="502" height="636">
        <figcaption><strong>Гранит чёрный</strong>Портрет художественный</figcaption>
      </figure>
      <figure class="shot pop">
        <img src="work-red.jpg" alt="Памятник из красно-коричневого гранита" width="502" height="643">
        <figcaption><strong>Гранит красно-коричневый</strong>Стела «Прямая»</figcaption>
      </figure>
      <figure class="shot pop">
        <img src="work-gray.jpg" alt="Памятник из серого гранита" width="502" height="639">
        <figcaption><strong>Гранит серый</strong>Стела «Прямая»</figcaption>
      </figure>
      <figure class="shot pop">
        <img src="work-brown.jpg" alt="Памятник из коричневого гранита" width="502" height="632">
        <figcaption><strong>Гранит коричневый</strong>Стела «Прямая»</figcaption>
      </figure>
      <figure class="shot pop">
        <img src="work-portrait.jpg" alt="Памятник из чёрного гранита с художественным портретом" width="502" height="630">
        <figcaption><strong>Гранит чёрный</strong>Портрет художественный</figcaption>
      </figure>
      <figure class="shot pop">
        <img src="work-jet.jpg" alt="Памятник из чёрного гранита, портрет с фоном" width="502" height="630">
        <figcaption><strong>Гранит чёрный</strong>Стела прямая, портрет с фоном</figcaption>
      </figure>
      <figure class="shot pop">
        <img src="work-military.jpg" alt="Памятник из чёрного гранита, стела прямая" width="502" height="636">
        <figcaption><strong>Гранит чёрный</strong>Стела прямая</figcaption>
      </figure>
    </div>
  </div>
</main>
<footer>
  <div class="wrap"><a href="../">На главную</a> · <a href="tel:+73422982959">+7 (342) 298-29-59</a></div>
</footer>
<script>
(function () {
  var burger = document.getElementById('burger');
  var links = document.getElementById('navLinks');
  burger.addEventListener('click', function () {
    var open = links.classList.toggle('open');
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
    burger.textContent = open ? '×' : '☰';
  });
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || typeof gsap === 'undefined') return;
  gsap.registerPlugin(ScrollTrigger);
  gsap.utils.toArray('.pop').forEach(function (el) {
    gsap.from(el, {
      y: 50,
      scale: 0.9,
      opacity: 0,
      duration: 0.85,
      ease: 'back.out(1.7)',
      scrollTrigger: { trigger: el, start: 'top 92%', once: true }
    });
  });
})();
</script>
</body>
</html>
